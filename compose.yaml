# Docker never rotates json-file logs by default; ollama alone writes ~115 lines per call.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mbxread:
    build: .
    image: mbxread
    # Localhost only: no auth, so nothing off this machine may reach it (issue #8).
    ports:
      - "127.0.0.1:8002:8002"
    env_file: .env
    environment:
      ANKICONNECT_URL: http://host.docker.internal:8765
      DATABASE_URL: postgresql://mbxread:${POSTGRES_PASSWORD:-mbxread}@db:5432/mbxread
      EMBED_URL: http://embed:80
      OLLAMA_URL: http://ollama:11434
    # Docker Desktop defines host.docker.internal already; Linux needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_USER: mbxread
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbxread}
      POSTGRES_DB: mbxread
    # Localhost only, for dev and tests; 5432 is taken on this machine.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mbxread-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mbxread", "-d", "mbxread"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Nightly pg_dump into BACKUP_DIR; keeps the newest 14. Restore: README, "Moving machines".
  backup:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      PGHOST: db
      PGUSER: mbxread
      PGPASSWORD: ${POSTGRES_PASSWORD:-mbxread}
      PGDATABASE: mbxread
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/mbxread-$$(date +%F).dump
          if pg_dump -Fc -f $$f.tmp; then
            mv $$f.tmp $$f && echo "backup ok: $$f"
            ls -1t /backups/mbxread-*.dump | tail -n +15 | xargs -r rm --
          else
            rm -f $$f.tmp; echo "backup FAILED"
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Sentence embeddings for same-sense search; weights download into the volume once.
  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    command: ["--model-id", "BAAI/bge-m3", "--revision", "5617a9f61b028005a4858fdac845db406aefb181"]
    # Localhost only, so dev runs and the eval script can reach it.
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - mbxread-embed:/data
    restart: unless-stopped
    logging: *logging

  # Local LLM for the sense explanation. Pull the model once:
  #   docker compose exec ollama ollama pull <OLLAMA_MODEL>
  ollama:
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - mbxread-ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging: *logging

volumes:
  mbxread-pg:
  mbxread-embed:
  mbxread-ollama:
